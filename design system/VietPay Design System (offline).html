ign-off.<\u002Fdiv>\n      <\u002Fsection>\n\n    <\u002Fdiv>\n\n    <footer style=\"border-top:1px solid #DFDFDF;padding:28px 64px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px;font-size:14px;font-weight:600;color:#696B68\">\n      <span>VietPay Design System — Compact v1.0<\u002Fspan>\n      <span>Dynamic · Fulfillment · Customer Satisfaction<\u002Fspan>\n    <\u002Ffooter>\n  <\u002Fmain>\n\n  <!-- MODAL -->\n  <sc-if value=\"{{ modal }}\" hint-placeholder-val=\"{{ false }}\">\n    <div sc-camel-on-click=\"{{ closeModal }}\" style=\"position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:50;animation:vp-scrim .2s ease;padding:24px\">\n      <div sc-camel-on-click=\"{{ stop }}\" style=\"background:#fff;border-radius:8px;padding:32px;max-width:460px;width:100%;box-shadow:0 20px 48px rgba(0,0,0,.28);animation:vp-modal .24s cubic-bezier(.2,0,0,1)\">\n        <div style=\"font-size:18px;font-weight:600;color:#1C1D1B;margin-bottom:10px\">Confirm your request<\u002Fdiv>\n        <div style=\"font-size:16px;color:#696B68;line-height:1.5;margin-bottom:26px\">Keep copy short, one clear decision, and put the recommended action on the right.<\u002Fdiv>\n        <div style=\"display:flex;justify-content:flex-end;gap:12px\">\n          <button sc-camel-on-click=\"{{ closeModal }}\" style=\"background:#fff;color:#DA291C;border:1.5px solid #DA291C;border-radius:8px;padding:10px 22px;font:600 14px 'Be Vietnam Pro';cursor:pointer\">Cancel<\u002Fbutton>\n          <button sc-camel-on-click=\"{{ closeModal }}\" style=\"background:#DA291C;color:#fff;border:none;border-radius:8px;padding:11px 24px;font:600 14px 'Be Vietnam Pro';cursor:pointer\">Confirm<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1360,&quot;height&quot;:900},&quot;stickyNav&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Layout&quot;},&quot;density&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;Comfortable&quot;,&quot;options&quot;:[&quot;Comfortable&quot;,&quot;Compact&quot;],&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Layout&quot;}}\">\nclass Component extends DCLogic {\n  state = { tab: 0, tokenView: 0, sw: true, modal: false, chk1: true, chk2: false, radio: 'standard', page: 3, tip: false };\n\n  componentDidMount() {\n    this._esc = (e) => { if (e.key === 'Escape') this.setState({ modal: false }); };\n    window.addEventListener('keydown', this._esc);\n  }\n  componentWillUnmount() { window.removeEventListener('keydown', this._esc); }\n\n  tokenCodeFor(v) {\n    if (v === 1) return [\n      'color/primary/default   #DA291C',\n      'color/primary/hover     #A31F15',\n      'color/primary/surface   #F6C9C6',\n      'color/premium/default   #D7A44C',\n      'color/ink/900           #1C1D1B',\n      'color/text/default      #373A36',\n      'color/text/muted        #696B68',\n      'color/surface/page      #FFFFFF',\n      'color/surface/raised    #F5F5F4',\n      'color/border/default    #DFDFDF',\n      'color/border/subtle     #EDEDED',\n      'color/error/text        #A31F15',\n      'color/error/surface     #F6C9C6',\n      'color/success/text      #2E7D5B   ⚠',\n      'color/warning/text      #B27C12   ⚠',\n      'color/info/text         #2A6F97   ⚠',\n      'space/xs · sm · md · lg  4·8·16·24',\n      'space/xl · 2xl · 3xl·4xl 32·48·64·96',\n      'radius/sm·md·lg·pill     4·6·8·999',\n      'type/h1 · h2 · h3 · h4   48·30·18·14',\n      'type/body · caption      16 · 11',\n      'motion/base              200 · ease-standard',\n      'breakpoint/sm·md·lg·xl   640·768·1024·1280'\n    ].join('\\n');\n    if (v === 2) return [\n      '{',\n      '  \"color\": {',\n      '    \"primary\": { \"default\": \"#DA291C\", \"hover\": \"#A31F15\", \"surface\": \"#F6C9C6\" },',\n      '    \"premium\": { \"default\": \"#D7A44C\" },',\n      '    \"ink\": { \"900\": \"#1C1D1B\" },',\n      '    \"text\": { \"default\": \"#373A36\", \"muted\": \"#696B68\" },',\n      '    \"surface\": { \"page\": \"#FFFFFF\", \"raised\": \"#F5F5F4\" },',\n      '    \"border\": { \"default\": \"#DFDFDF\", \"subtle\": \"#EDEDED\" },',\n      '    \"error\":   { \"text\": \"#A31F15\", \"surface\": \"#F6C9C6\" },',\n      '    \"success\": { \"text\": \"#2E7D5B\", \"surface\": \"#DCEEE4\" },',\n      '    \"warning\": { \"text\": \"#B27C12\", \"surface\": \"#FBEED1\" },',\n      '    \"info\":    { \"text\": \"#2A6F97\", \"surface\": \"#DCEAF2\" }',\n      '  },',\n      '  \"space\":  { \"xs\":4, \"sm\":8, \"md\":16, \"lg\":24, \"xl\":32, \"2xl\":48, \"3xl\":64, \"4xl\":96 },',\n      '  \"radius\": { \"sm\":4, \"md\":6, \"lg\":8, \"pill\":999 },',\n      '  \"type\":   { \"h1\":48, \"h2\":30, \"h3\":18, \"h4\":14, \"body\":16, \"caption\":11 },',\n      '  \"motion\": { \"fast\":120, \"base\":200, \"slow\":320, \"ease\":\"cubic-bezier(.2,0,0,1)\" },',\n      '  \"breakpoint\": { \"sm\":640, \"md\":768, \"lg\":1024, \"xl\":1280 }',\n      '}'\n    ].join('\\n');\n    return [\n      ':root {',\n      '  /* Color — brand */',\n      '  --color-primary: #DA291C;',\n      '  --color-primary-hover: #A31F15;',\n      '  --color-primary-surface: #F6C9C6;',\n      '  --color-premium: #D7A44C;',\n      '  /* Color — ink & text */',\n      '  --color-ink: #1C1D1B;',\n      '  --color-text: #373A36;',\n      '  --color-text-muted: #696B68;',\n      '  /* Color — surface & border */',\n      '  --color-surface-page: #FFFFFF;',\n      '  --color-surface-raised: #F5F5F4;',\n      '  --color-border: #DFDFDF;',\n      '  --color-border-subtle: #EDEDED;',\n      '  /* Color — semantic */',\n      '  --color-error: #A31F15;   --color-error-surface: #F6C9C6;',\n      '  --color-success: #2E7D5B; --color-success-surface: #DCEEE4; /* ⚠ */',\n      '  --color-warning: #B27C12; --color-warning-surface: #FBEED1; /* ⚠ */',\n      '  --color-info: #2A6F97;    --color-info-surface: #DCEAF2;    /* ⚠ */',\n      '  /* Typography */',\n      '  --font-sans: \"Be Vietnam Pro\", system-ui, sans-serif;',\n      '  --text-h1: 48px; --text-h2: 30px; --text-h3: 18px; --text-h4: 14px;',\n      '  --text-body: 16px; --text-p: 20px; --text-caption: 11px;',\n      '  /* Spacing — 4px base */',\n      '  --space-xs: 4px;  --space-sm: 8px;  --space-md: 16px; --space-lg: 24px;',\n      '  --space-xl: 32px; --space-2xl: 48px; --space-3xl: 64px; --space-4xl: 96px;',\n      '  /* Radius & border */',\n      '  --radius-sm: 4px; --radius-md: 6px; --radius-lg: 8px; --radius-pill: 999px;',\n      '  --border-width: 1px; --border-width-strong: 1.5px;',\n      '  /* Elevation */',\n      '  --shadow-sm: 0 1px 2px rgba(0,0,0,.06);',\n      '  --shadow-md: 0 4px 12px rgba(0,0,0,.10);',\n      '  --shadow-modal: 0 20px 48px rgba(0,0,0,.28);',\n      '  /* Motion */',\n      '  --ease-standard: cubic-bezier(.2,0,0,1);',\n      '  --duration-fast: 120ms; --duration-base: 200ms; --duration-slow: 320ms;',\n      '  /* Breakpoints */',\n      '  --bp-sm: 640px; --bp-md: 768px; --bp-lg: 1024px; --bp-xl: 1280px;',\n      '}'\n    ].join('\\n');\n  }\n\n  renderVals() {\n    const S = this.state;\n    const set = (o) => this.setState(o);\n    const RED = '#DA291C', MUT = '#696B68';\n\n    const tabBodies = [\n      'Overview — your balance, recent activity and quick actions at a glance.',\n      'Activity — every transaction, searchable and filterable by date or merchant.',\n      'Settings — cards, limits, security and notification preferences.'\n    ];\n    const tokenViews = ['CSS', 'Figma', 'JSON'];\n\n    return {\n      navPos: this.props.stickyNav ?? true ? 'sticky' : 'static',\n      sectionGap: (this.props.density ?? 'Comfortable') === 'Compact' ? '52px' : '76px',\n\n      navItems: [\n        { n: '01', label: 'Design Principles', href: '#principles' },\n        { n: '02', label: 'Color System', href: '#color' },\n        { n: '03', label: 'Typography', href: '#type' },\n        { n: '04', label: 'Spacing & Layout', href: '#spacing' },\n        { n: '05', label: 'Shape & Visual Style', href: '#shape' },\n        { n: '06', label: 'Design Tokens', href: '#tokens' },\n        { n: '07', label: 'Components', href: '#components' },\n        { n: '08', label: 'Interaction & Motion', href: '#motion' },\n        { n: '09', label: 'UX Writing', href: '#writing' },\n        { n: '10', label: 'Accessibility', href: '#a11y' },\n        { n: '11', label: 'Responsive', href: '#responsive' },\n        { n: '12', label: 'Governance', href: '#governance' }\n      ],\n      coverTags: ['Be Vietnam Pro', '4px base grid', 'WCAG 2.1 AA', 'Mobile + Web', 'Figma · Storybook · Code'],\n\n      principles: [\n        { k: 'CLARITY', title: 'Clarity over decoration', body: 'Every screen states its purpose plainly. Confident, concise, action-oriented copy and layout — nothing competes with the task.', practice: 'lead with the outcome; trim any element that doesn\\u2019t help the user act.' },\n        { k: 'FOCUS', title: 'One primary action per view', body: 'Red is the signal color. Exactly one primary action per view earns it; everything else is secondary or ghost.', practice: 'one red button per screen; demote the rest to outline / text.' },\n        { k: 'FULFILLMENT', title: 'Reliable & consistent', body: 'Deliver on every commitment. Same tokens, same patterns, same wording everywhere so the product feels dependable.', practice: 'reuse components and tokens before inventing; predictable beats clever.' },\n        { k: 'DYNAMIC', title: 'Always moving forward', body: 'Energetic and agile. Fast, responsive feedback for every action makes the product feel alive without feeling busy.', practice: 'confirm within 100ms; keep motion under 320ms and purposeful.' },\n        { k: 'CUSTOMER', title: 'Customer at the center', body: 'Put customer satisfaction first. Anticipate needs, prevent errors, and speak in terms of what the person gains.', practice: 'write and design for the user\\u2019s goal, not the system\\u2019s structure.' }\n      ],\n\n      brandColors: [\n        { hex: '#DA291C', bg: '#DA291C', name: 'Primary Red', use: 'Primary CTA, active/links, section accent. Never body or large fills.' },\n        { hex: '#A31F15', bg: '#A31F15', name: 'Deep Red', use: 'Hover / pressed of primary red. Error text on pink.' },\n        { hex: '#1C1D1B', bg: '#1C1D1B', name: 'Near Black', use: 'Default ink — text and wordmark.' },\n        { hex: '#D7A44C', bg: '#D7A44C', name: 'Gold Accent', use: 'Small premium highlights only (VIP, rewards). Keep <10%.' }\n      ],\n      neutralColors: [\n        { hex: '#1C1D1B', bg: '#1C1D1B', name: 'neutral/900' },\n        { hex: '#373A36', bg: '#373A36', name: 'neutral/800 · body' },\n        { hex: '#696B68', bg: '#696B68', name: 'neutral/500 · muted' },\n        { hex: '#DFDFDF', bg: '#DFDFDF', name: 'neutral/300 · border' },\n        { hex: '#EDEDED', bg: '#EDEDED', name: 'neutral/200 · subtle' },\n        { hex: '#F5F5F4', bg: '#F5F5F4', name: 'neutral/100 · raised' },\n        { hex: '#FFFFFF', bg: '#FFFFFF', name: 'neutral/0 · page' }\n      ],\n      accentColors: [\n        { hex: '#D7A44C', bg: '#D7A44C', name: 'Gold Accent' },\n        { hex: '#F6C9C6', bg: '#F6C9C6', name: 'Light Pink · surface' },\n        { hex: '#FBECEB', bg: '#FBECEB', name: 'Red 50 · tint' }\n      ],\n      semanticColors: [\n        { label: 'Error', solid: '#A31F15', surface: '#F6C9C6', surfaceHex: '#F6C9C6', proposed: false },\n        { label: 'Success', solid: '#2E7D5B', surface: '#DCEEE4', surfaceHex: '#DCEEE4', proposed: true },\n        { label: 'Warning', solid: '#B27C12', surface: '#FBEED1', surfaceHex: '#FBEED1', proposed: true },\n        { label: 'Info', solid: '#2A6F97', surface: '#DCEAF2', surfaceHex: '#DCEAF2', proposed: true }\n      ],\n      contrast: [\n        { pair: 'Near black on white', bg: '#FFFFFF', fg: '#1C1D1B', ratio: '17.4:1', verdict: 'AAA', verdictColor: '#2E7D5B' },\n        { pair: 'Charcoal on white (body)', bg: '#FFFFFF', fg: '#373A36', ratio: '10.6:1', verdict: 'AAA', verdictColor: '#2E7D5B' },\n        { pair: 'Muted gray on white', bg: '#FFFFFF', fg: '#696B68', ratio: '4.7:1', verdict: 'AA', verdictColor: '#2E7D5B' },\n        { pair: 'White on primary red', bg: '#DA291C', fg: '#FFFFFF', ratio: '4.3:1', verdict: 'AA', verdictColor: '#2E7D5B' },\n        { pair: 'Deep red on pink surface', bg: '#F6C9C6', fg: '#A31F15', ratio: '4.6:1', verdict: 'AA', verdictColor: '#2E7D5B' },\n        { pair: 'White on gold', bg: '#D7A44C', fg: '#FFFFFF', ratio: '1.9:1', verdict: 'FAIL', verdictColor: '#A31F15' }\n      ],\n\n      typeScale: [\n        { name: 'H1', spec: '48 / 700 / lh 48', sample: 'Send money in seconds', size: '48px', weight: 700, lh: '48px' },\n        { name: 'H2', spec: '30 / 700 / lh 36', sample: 'Your accounts, together', size: '30px', weight: 700, lh: '36px' },\n        { name: 'H3', spec: '18 / 600 / lh 28', sample: 'Recent transactions', size: '18px', weight: 600, lh: '28px' },\n        { name: 'H4', spec: '14 / 600 / lh 20', sample: 'CARD DETAILS', size: '14px', weight: 600, lh: '20px' },\n        { name: 'Paragraph', spec: '20 / 400 / lh 30', sample: 'Descriptive copy for products and services.', size: '20px', weight: 400, lh: '30px' },\n        { name: 'Body', spec: '16 / 400 / lh 24', sample: 'Base text — the default for the page.', size: '16px', weight: 400, lh: '24px' },\n        { name: 'Caption / Label', spec: '14 / 500 / lh 20', sample: 'Helper text and field labels.', size: '14px', weight: 500, lh: '20px' }\n      ],\n\n      spacing: [\n        { name: 'space-xs', px: '4px' }, { name: 'space-sm', px: '8px' }, { name: 'space-md', px: '16px' }, { name: 'space-lg', px: '24px' },\n        { name: 'space-xl', px: '32px' }, { name: 'space-2xl', px: '48px' }, { name: 'space-3xl', px: '64px' }, { name: 'space-4xl', px: '96px' }\n      ],\n      layoutSpecs: [\n        { k: 'Grid', v: '12-col fluid' }, { k: 'Gutter', v: '24px' }, { k: 'Max container', v: '1200px' },\n        { k: 'Page margin (desktop)', v: '48px' }, { k: 'Page margin (mobile)', v: '16px' }\n      ],\n      breakpoints: [\n        { token: 'sm', min: '640px', cols: '4 → stack', target: 'Large phones' },\n        { token: 'md', min: '768px', cols: '8', target: 'Tablets' },\n        { token: 'lg', min: '1024px', cols: '12', target: 'Laptops' },\n        { token: 'xl', min: '1280px', cols: '12 · capped', target: 'Desktop / wide' }\n      ],\n\n      radii: [\n        { name: 'radius-sm', val: '4px', use: 'inner / chips' },\n        { name: 'radius-md', val: '6px', use: 'cards' },\n        { name: 'radius-lg', val: '8px', use: 'buttons, inputs, modals' },\n        { name: 'radius-pill', val: '999px', use: 'badges, switch' }\n      ],\n      shadows: [\n        { name: 'shadow-sm', val: '0 1px 2px rgba(0,0,0,.06)', use: 'Resting cards, subtle lift.' },\n        { name: 'shadow-md', val: '0 4px 12px rgba(0,0,0,.10)', use: 'Dropdowns, popovers, hover.' },\n        { name: 'shadow-modal', val: '0 20px 48px rgba(0,0,0,.28)', use: 'Modals & dialogs over scrim.' }\n      ],\n\n      tokenTabs: tokenViews.map((label, i) => ({\n        label,\n        onClick: () => set({ tokenView: i }),\n        bg: S.tokenView === i ? RED : '#fff',\n        color: S.tokenView === i ? '#fff' : '#373A36',\n        border: S.tokenView === i ? RED : '#DFDFDF'\n      })),\n      tokenCode: this.tokenCodeFor(S.tokenView),\n\n      // selection controls\n      toggleChk1: () => set({ chk1: !S.chk1 }),\n      toggleChk2: () => set({ chk2: !S.chk2 }),\n      chk1Bg: S.chk1 ? RED : '#fff', chk1Border: S.chk1 ? RED : '#DFDFDF', chk1Mark: S.chk1 ? '✓' : '',\n      chk2Bg: S.chk2 ? RED : '#fff', chk2Border: S.chk2 ? RED : '#DFDFDF', chk2Mark: S.chk2 ? '✓' : '',\n      radioOpts: [\n        { label: 'Standard transfer', border: S.radio === 'standard' ? RED : '#DFDFDF', dot: S.radio === 'standard' ? RED : 'transparent', onClick: () => set({ radio: 'standard' }) },\n        { label: 'Instant transfer', border: S.radio === 'instant' ? RED : '#DFDFDF', dot: S.radio === 'instant' ? RED : 'transparent', onClick: () => set({ radio: 'instant' }) }\n      ],\n      toggleSw: () => set({ sw: !S.sw }),\n      swBg: S.sw ? RED : '#DFDFDF', swX: S.sw ? '21px' : '3px', swLabel: S.sw ? 'on' : 'off',\n\n      // tabs\n      tabs: [0, 1, 2].map((i) => ({\n        label: ['Overview', 'Activity', 'Settings'][i],\n        onClick: () => set({ tab: i }),\n        color: S.tab === i ? '#1C1D1B' : MUT,\n        underline: S.tab === i ? RED : 'transparent'\n      })),\n      tabBody: tabBodies[S.tab],\n\n      bottomNav: [\n        { label: 'Home', icon: RED, color: RED },\n        { label: 'Cards', icon: '#C9CBC8', color: MUT },\n        { label: 'Send', icon: '#C9CBC8', color: MUT },\n        { label: 'Profile', icon: '#C9CBC8', color: MUT }\n      ],\n\n      // modal\n      modal: S.modal,\n      openModal: () => set({ modal: true }),\n      closeModal: () => set({ modal: false }),\n      stop: (e) => e.stopPropagation(),\n\n      // tooltip\n      tip: S.tip,\n      showTip: () => set({ tip: true }),\n      hideTip: () => set({ tip: false }),\n\n      alerts: [\n        { icon: '✕', title: 'Payment failed', body: 'Please check your card details and try again.', solid: '#A31F15', surface: '#F6C9C6' },\n        { icon: '✓', title: 'Payment successful', body: 'Your transaction has been completed. ⚠ proposed', solid: '#2E7D5B', surface: '#DCEEE4' },\n        { icon: '!', title: 'Card expiring soon', body: 'Update your card before the 30th to avoid interruption. ⚠ proposed', solid: '#B27C12', surface: '#FBEED1' },\n        { icon: 'i', title: 'Scheduled maintenance', body: 'Transfers pause Sun 02:00–03:00. ⚠ proposed', solid: '#2A6F97', surface: '#DCEAF2' }\n      ],\n\n      rows: [\n        { date: 'Jul 21', merchant: 'GrabFood', status: 'Completed', statusColor: '#2E7D5B', statusBg: '#DCEEE4', amount: '−₫185,000' },\n        { date: 'Jul 20', merchant: 'Salary — Acme Co', status: 'Received', statusColor: '#2E7D5B', statusBg: '#DCEEE4', amount: '+₫24,500,000' },\n        { date: 'Jul 19', merchant: 'Highlands Coffee', status: 'Failed', statusColor: '#A31F15', statusBg: '#F6C9C6', amount: '−₫72,000' }\n      ],\n      pages: (() => {\n        const items = [{ label: '‹', v: Math.max(1, S.page - 1) }, { label: '1', v: 1 }, { label: '2', v: 2 }, { label: '3', v: 3 }, { label: '4', v: 4 }, { label: '›', v: Math.min(6, S.page + 1) }];\n        return items.map((it) => {\n          const active = it.label === String(S.page);\n          return { label: it.label, onClick: () => set({ page: it.v }), bg: active ? RED : '#fff', color: active ? '#fff' : '#373A36', border: active ? RED : '#DFDFDF' };\n        });\n      })(),\n\n      states: [\n        { k: 'Hover', v: 'Color shift + shadow-md; cursor pointer' },\n        { k: 'Focus', v: '3px #F6C9C6 ring, never removed' },\n        { k: 'Pressed', v: 'Deep red #A31F15, subtle scale 0.98' },\n        { k: 'Selected', v: 'Red fill or 2px red underline' },\n        { k: 'Disabled', v: 'Opacity 0.45, cursor not-allowed' },\n        { k: 'Loading', v: 'Spinner in place, control stays sized' }\n      ],\n      motionSpecs: [\n        { k: 'Fast (hover, toggle)', v: '120ms' },\n        { k: 'Base (most UI)', v: '200ms' },\n        { k: 'Slow (modal, page)', v: '320ms' },\n        { k: 'Easing (standard)', v: 'cubic-bezier(.2,0,0,1)' },\n        { k: 'Reduced motion', v: 'honor prefers-reduced-motion' }\n      ],\n\n      writing: [\n        { el: 'Buttons', do: 'Verb + object: “Send money”, “Add card”', dont: '“Submit”, “OK”, “Click here”' },\n        { el: 'Labels', do: 'Short noun: “Card number”', dont: 'Sentences or ALL CAPS questions' },\n        { el: 'Helper text', do: 'One line, what to enter or why', dont: 'Repeat the label or add jargon' },\n        { el: 'Validation', do: '“Enter a 16-digit card number”', dont: '“Invalid input”, error codes' },\n        { el: 'Errors', do: 'Cause + fix, calm tone', dont: 'Blame the user or say “oops!”' },\n        { el: 'Empty states', do: 'What’s missing + one action', dont: 'Just “No data”' },\n        { el: 'Confirmation', do: '“Payment sent to An · ₫250k”', dont: '“Success!” with no detail' }\n      ],\n\n      a11y: [\n        { title: 'Color contrast', body: 'AA minimum — 4.5:1 for text, 3:1 for large text & UI. Never white on gold.' },\n        { title: 'Keyboard navigation', body: 'Every action reachable and operable by keyboard; logical tab order, no traps.' },\n        { title: 'Focus visibility', body: 'Persistent 3px #F6C9C6 focus ring on all interactive elements — never remove outlines.' },\n        { title: 'Touch targets', body: 'Minimum 44×44px on mobile; 8px spacing between adjacent targets.' },\n        { title: 'Form labels', body: 'Every field has a visible, programmatically-linked label. Placeholders never replace labels.' },\n        { title: 'Error communication', body: 'Convey errors with icon + text + color, never color alone. Link error to its field.' },\n        { title: 'Screen readers', body: 'Semantic HTML, alt text, ARIA only where native semantics fall short. Announce live changes.' },\n        { title: 'Reduced motion', body: 'Respect prefers-reduced-motion: disable non-essential animation, keep instant feedback.' }\n      ],\n\n      responsive: [\n        { aspect: 'Typography', mobile: 'H1 32 · P 18', tablet: 'H1 40 · P 20', desktop: 'H1 48 · P 20' },\n        { aspect: 'Spacing', mobile: 'Margin 16px', tablet: 'Margin 32px', desktop: 'Margin 48px' },\n        { aspect: 'Layout', mobile: 'Single column', tablet: '8-col, 2-up', desktop: '12-col, 3-up' },\n        { aspect: 'Navigation', mobile: 'Bottom tab bar', tablet: 'Top bar', desktop: 'Top bar + rail' },\n
