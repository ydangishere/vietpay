document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

ortant;transition-duration:.001ms!important;scroll-behavior:auto}}\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<div style=\"display:flex;align-items:flex-start;max-width:1360px;margin:0 auto;background:#F5F5F4\">\n\n  <aside style=\"position:{{ navPos }};top:0;flex:0 0 248px;height:100vh;overflow-y:auto;background:#1C1D1B;color:#fff;padding:32px 22px 40px\">\n    <div style=\"display:flex;align-items:center;gap:10px;margin-bottom:6px\">\n      <div style=\"width:34px;height:34px;border-radius:8px;background:#DA291C;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:17px;color:#fff\">V<\u002Fdiv>\n      <div style=\"font-weight:700;font-size:18px;color:#fff;letter-spacing:-.2px\">VietPay<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"font-size:11px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:#DA291C;margin:0 0 2px 44px\">Design System<\u002Fdiv>\n    <div style=\"font-size:12px;color:#8b8d8a;margin:0 0 26px 44px\">v1.0 · Apply-ready<\u002Fdiv>\n    <nav style=\"display:flex;flex-direction:column;gap:1px\">\n      <sc-for list=\"{{ navItems }}\" as=\"it\" hint-placeholder-count=\"12\">\n        <a href=\"{{ it.href }}\" style=\"display:flex;gap:12px;padding:8px 10px;border-radius:6px;font-size:14px;color:#c9cbc8;font-weight:500\" style-hover=\"background:#2a2b29;color:#fff\">\n          <span style=\"color:#DA291C;font-weight:700;font-variant-numeric:tabular-nums;min-width:20px\">{{ it.n }}<\u002Fspan>\n          <span>{{ it.label }}<\u002Fspan>\n        <\u002Fa>\n      <\u002Fsc-for>\n    <\u002Fnav>\n    <div style=\"margin-top:28px;padding-top:20px;border-top:1px solid #33352f;font-size:12px;line-height:1.6;color:#7f817d\">Dynamic · Fulfillment · Customer Satisfaction<\u002Fdiv>\n  <\u002Faside>\n\n  <main style=\"flex:1 1 auto;min-width:0;background:#fff;border-left:1px solid #EDEDED;border-right:1px solid #EDEDED\">\n\n    <!-- COVER -->\n    <header style=\"padding:72px 64px 48px;border-bottom:4px solid #DA291C;background:linear-gradient(180deg,#fff, #FBECEB)\">\n      <div style=\"font-size:13px;font-weight:600;letter-spacing:2px;text-transform:uppercase;color:#DA291C;margin-bottom:20px\">VietPay · Brand Style Guide → Design System<\u002Fdiv>\n      <h1 style=\"font-size:52px;line-height:1.05;font-weight:700;color:#1C1D1B;margin:0 0 20px;letter-spacing:-1px;max-width:760px\">Design System<\u002Fh1>\n      <p style=\"font-size:20px;line-height:1.5;color:#373A36;max-width:680px;margin:0 0 28px\">A compact, production-ready system that turns the VietPay brand direction into practical UI rules for designers and developers — across mobile and web.<\u002Fp>\n      <div style=\"display:flex;flex-wrap:wrap;gap:10px\">\n        <sc-for list=\"{{ coverTags }}\" as=\"t\" hint-placeholder-count=\"5\">\n          <span style=\"display:inline-flex;align-items:center;padding:7px 14px;border-radius:999px;background:#fff;border:1px solid #DFDFDF;font-size:13px;font-weight:600;color:#373A36\">{{ t }}<\u002Fspan>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <div style=\"margin-top:28px;padding:16px 18px;border-radius:8px;background:#fff;border:1px solid #DFDFDF;border-left:4px solid #D7A44C;font-size:14px;color:#373A36;max-width:760px;line-height:1.55\">\n        <strong style=\"color:#1C1D1B\">Source of truth.<\u002Fstrong> Every value below is derived from the approved VietPay Style Guide. Items not covered by the guide are marked <span style=\"color:#B27C12;font-weight:600\">⚠ Extends the Style Guide<\u002Fspan> and require brand approval before use.\n      <\u002Fdiv>\n    <\u002Fheader>\n\n    <div style=\"display:flex;flex-direction:column;gap:{{ sectionGap }};padding:{{ sectionGap }} 64px\">\n\n      <!-- 01 PRINCIPLES -->\n      <section id=\"principles\">\n        <div style=\"display:flex;align-items:baseline;gap:14px;margin-bottom:8px\"><span style=\"font-size:14px;font-weight:700;color:#DA291C\">01<\u002Fspan><h2 style=\"font-size:30px;font-weight:700;color:#1C1D1B;margin:0;letter-spacing:-.4px\">Design Principles<\u002Fh2><\u002Fdiv>\n        <p style=\"font-size:18px;color:#696B68;margin:0 0 28px;max-width:640px\">Five rules distilled from the brand personality (Dynamic · Fulfillment · Customer Satisfaction) and tone: confident yet friendly, concise, action-oriented.<\u002Fp>\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px\">\n          <sc-for list=\"{{ principles }}\" as=\"p\" hint-placeholder-count=\"5\">\n            <div style=\"border:1px solid #DFDFDF;border-top:4px solid #DA291C;border-radius:6px;padding:22px 22px 20px;display:flex;flex-direction:column;gap:10px\">\n              <div style=\"font-size:13px;font-weight:700;color:#DA291C\">{{ p.k }}<\u002Fdiv>\n              <div style=\"font-size:18px;font-weight:600;color:#1C1D1B;line-height:1.3\">{{ p.title }}<\u002Fdiv>\n              <div style=\"font-size:15px;color:#373A36;line-height:1.55\">{{ p.body }}<\u002Fdiv>\n              <div style=\"margin-top:4px;font-size:13px;color:#696B68;line-height:1.5;padding-top:12px;border-top:1px solid #EDEDED\"><strong style=\"color:#373A36\">In practice — <\u002Fstrong>{{ p.practice }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <!-- 02 COLOR -->\n      <section id=\"color\">\n        <div style=\"display:flex;align-items:baseline;gap:14px;margin-bottom:8px\"><span style=\"font-size:14px;font-weight:700;color:#DA291C\">02<\u002Fspan><h2 style=\"font-size:30px;font-weight:700;color:#1C1D1B;margin:0;letter-spacing:-.4px\">Color System<\u002Fh2><\u002Fdiv>\n        <p style=\"font-size:18px;color:#696B68;margin:0 0 28px;max-width:660px\">Red is the signal color — reserve it for one clear action per view. Charcoal and near-black carry the page; gold is for small premium highlights only.<\u002Fp>\n\n        <h3 style=\"font-size:16px;font-weight:600;color:#1C1D1B;margin:0 0 14px\">Brand &amp; primary<\u002Fh3>\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px;margin-bottom:34px\">\n          <sc-for list=\"{{ brandColors }}\" as=\"c\" hint-placeholder-count=\"4\">\n            <div style=\"border:1px solid #EDEDED;border-radius:8px;overflow:hidden\">\n              <div style=\"height:88px;background:{{ c.bg }};border-bottom:1px solid #EDEDED\"><\u002Fdiv>\n              <div style=\"padding:12px 14px 14px\">\n                <div style=\"font-size:13px;font-weight:700;color:#1C1D1B;font-family:'JetBrains Mono',monospace\">{{ c.hex }}<\u002Fdiv>\n                <div style=\"font-size:13px;color:#696B68;margin-top:2px\">{{ c.name }}<\u002Fdiv>\n                <div style=\"font-size:12px;color:#8b8d8a;margin-top:6px;line-height:1.4\">{{ c.use }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n\n        <h3 style=\"font-size:16px;font-weight:600;color:#1C1D1B;margin:0 0 14px\">Neutral palette<\u002Fh3>\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-bottom:34px\">\n          <sc-for list=\"{{ neutralColors }}\" as=\"c\" hint-placeholder-count=\"6\">\n            <div style=\"border:1px solid #EDEDED;border-radius:8px;overflow:hidden\">\n              <div style=\"height:64px;background:{{ c.bg }};border-bottom:1px solid #EDEDED\"><\u002Fdiv>\n              <div style=\"padding:10px 12px\">\n                <div style=\"font-size:12px;font-weight:700;color:#1C1D1B;font-family:'JetBrains Mono',monospace\">{{ c.hex }}<\u002Fdiv>\n                <div style=\"font-size:12px;color:#696B68;margin-top:2px\">{{ c.name }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n\n        <h3 style=\"font-size:16px;font-weight:600;color:#1C1D1B;margin:0 0 4px\">Accent &amp; secondary<\u002Fh3>\n        <p style=\"font-size:14px;color:#696B68;margin:0 0 14px\">Decoration and accents — keep gold under ~10% of any surface.<\u002Fp>\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-bottom:34px\">\n          <sc-for list=\"{{ accentColors }}\" as=\"c\" hint-placeholder-count=\"3\">\n            <div style=\"border:1px solid #EDEDED;border-radius:8px;overflow:hidden\">\n              <div style=\"height:64px;background:{{ c.bg }};border-bottom:1px solid #EDEDED\"><\u002Fdiv>\n              <div style=\"padding:10px 12px\">\n                <div style=\"font-size:12px;font-weight:700;color:#1C1D1B;font-family:'JetBrains Mono',monospace\">{{ c.hex }}<\u002Fdiv>\n                <div style=\"font-size:12px;color:#696B68;margin-top:2px\">{{ c.name }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n\n        <h3 style=\"font-size:16px;font-weight:600;color:#1C1D1B;margin:0 0 4px\">Semantic colors<\u002Fh3>\n        <p style=\"font-size:14px;color:#696B68;margin:0 0 14px\">Error is fully defined by the Style Guide (deep-red text on a pink surface). <span style=\"color:#B27C12;font-weight:600\">⚠ Success / Warning / Info extend the guide<\u002Fspan> — palette-harmonised proposals pending brand approval.<\u002Fp>\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px;margin-bottom:30px\">\n          <sc-for list=\"{{ semanticColors }}\" as=\"c\" hint-placeholder-count=\"4\">\n            <div style=\"border:1px solid #EDEDED;border-radius:8px;overflow:hidden\">\n              <div style=\"height:56px;background:{{ c.surface }};display:flex;align-items:center;padding:0 16px;gap:10px\">\n                <span style=\"width:14px;height:14px;border-radius:50%;background:{{ c.solid }}\"><\u002Fspan>\n                <span style=\"font-size:14px;font-weight:600;color:{{ c.solid }}\">{{ c.label }}<\u002Fspan>\n                <sc-if value=\"{{ c.proposed }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"margin-left:auto;font-size:10px;font-weight:700;color:#B27C12\">⚠<\u002Fspan><\u002Fsc-if>\n              <\u002Fdiv>\n              <div style=\"padding:12px 14px;font-size:12px;color:#696B68;line-height:1.6;font-family:'JetBrains Mono',monospace\">\n                <div>text&nbsp;&nbsp;&nbsp;<span style=\"color:#1C1D1B;font-weight:700\">{{ c.solid }}<\u002Fspan><\u002Fdiv>\n                <div>surface <span style=\"color:#1C1D1B;font-weight:700\">{{ c.surfaceHex }}<\u002Fspan><\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n\n        <h3 style=\"font-size:16px;font-weight:600;color:#1C1D1B;margin:0 0 14px\">Accessibility &amp; contrast<\u002Fh3>\n        <div style=\"border:1px solid #DFDFDF;border-radius:8px;overflow:hidden\">\n          <div style=\"display:grid;grid-template-columns:1.4fr 1fr .8fr .8fr;background:#F5F5F4;font-size:12px;font-weight:700;color:#696B68;text-transform:uppercase;letter-spacing:.5px\">\n            <div style=\"padding:11px 16px\">Pairing<\u002Fdiv><div style=\"padding:11px 12px\">Preview<\u002Fdiv><div style=\"padding:11px 12px\">Ratio*<\u002Fdiv><div style=\"padding:11px 12px\">Verdict<\u002Fdiv>\n          <\u002Fdiv>\n          <sc-for list=\"{{ contrast }}\" as=\"r\" hint-placeholder-count=\"6\">\n            <div style=\"display:grid;grid-template-columns:1.4fr 1fr .8fr .8fr;border-top:1px solid #EDEDED;align-items:center\">\n              <div style=\"padding:12px 16px;font-size:13px;color:#373A36\">{{ r.pair }}<\u002Fdiv>\n              <div style=\"padding:8px 12px\"><span style=\"display:inline-block;padding:5px 12px;border-radius:5px;font-size:13px;font-weight:600;background:{{ r.bg }};color:{{ r.fg }};border:1px solid #EDEDED\">Aa 中<\u002Fspan><\u002Fdiv>\n              <div style=\"padding:12px;font-size:13px;font-weight:600;color:#1C1D1B;font-variant-numeric:tabular-nums\">{{ r.ratio }}<\u002Fdiv>\n              <div style=\"padding:12px;font-size:12px;font-weight:700;color:{{ r.verdictColor }}\">{{ r.verdict }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <p style=\"font-size:12px;color:#8b8d8a;margin:10px 0 0\">*Approximate WCAG 2.1 ratios. Body text uses ≥16px so must clear 4.5:1; large/UI text (≥18.66px bold or ≥24px) and non-text UI need ≥3:1.<\u002Fp>\n        <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:18px\">\n          <div style=\"border:1px solid #DFDFDF;border-radius:6px;border-left:4px solid #DA291C;padding:14px 16px;font-size:14px;line-height:1.55\"><strong style=\"color:#DA291C\">Do<\u002Fstrong> — pair red only with white or near-black. Use charcoal <span style=\"font-family:'JetBrains Mono',monospace\">#373A36<\u002Fspan> for body, muted <span style=\"font-family:'JetBrains Mono',monospace\">#696B68<\u002Fspan> for secondary labels only.<\u002Fdiv>\n          <div style=\"border:1px solid #DFDFDF;border-radius:6px;border-left:4px solid #A31F15;padding:14px 16px;font-size:14px;line-height:1.55\"><strong style=\"color:#A31F15\">Don't<\u002Fstrong> — put white text on gold (fails), use pink for error text, or set body copy in primary red.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <!-- 03 TYPOGRAPHY -->\n      <section id=\"type\">\n        <div style=\"display:flex;align-items:baseline;gap:14px;margin-bottom:8px\"><span style=\"font-size:14px;font-weight:700;color:#DA291C\">03<\u002Fspan><h2 style=\"font-size:30px;font-weight:700;color:#1C1D1B;margin:0;letter-spacing:-.4px\">Typography<\u002Fh2><\u002Fdiv>\n        <p style=\"font-size:18px;color:#696B68;margin:0 0 24px;max-width:680px\">Typeface: <strong style=\"color:#373A36\">Be Vietnam Pro<\u002Fstrong> (fallback <span style=\"font-family:'JetBrains Mono',monospace;font-size:15px\">system-ui, sans-serif<\u002Fspan>) — humanist geometry with full Vietnamese diacritic support, applied across the entire product.<\u002Fp>\n        <div style=\"border:1px solid #DFDFDF;border-radius:8px;overflow:hidden\">\n          <sc-for list=\"{{ typeScale }}\" as=\"t\" hint-placeholder-count=\"7\">\n            <div style=\"display:flex;align-items:center;gap:20px;padding:18px 24px;border-top:1px solid #EDEDED\">\n              <div style=\"flex:1;min-width:0;color:#1C1D1B;font-weight:{{ t.weight }};font-size:{{ t.size }};line-height:{{ t.lh }};overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">{{ t.sample }}<\u002Fdiv>\n              <div style=\"flex:0 0 210px;text-align:right;font-size:13px;color:#696B68;font-family:'JetBrains Mono',monospace;line-height:1.5\">\n                <div style=\"color:#1C1D1B;font-weight:600\">{{ t.name }}<\u002Fdiv>\n                <div>{{ t.spec }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-top:20px\">\n          <div style=\"border:1px solid #DFDFDF;border-radius:6px;padding:16px 18px\">\n            <div style=\"font-size:13px;font-weight:700;color:#DA291C;margin-bottom:8px\">Weights<\u002Fdiv>\n            <div style=\"font-size:14px;line-height:1.9;color:#373A36\">400 Regular · body &amp; paragraphs<br>500 Medium · emphasis inline<br>600 SemiBold · H3/H4, labels, buttons<br>700 Bold · H1/H2, wordmark, figures<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"border:1px solid #DFDFDF;border-radius:6px;padding:16px 18px\">\n            <div style=\"font-size:13px;font-weight:700;color:#DA291C;margin-bottom:8px\">Letter spacing<\u002Fdiv>\n            <div style=\"font-size:14px;line-height:1.9;color:#373A36\">Headings −0.4px (tighten)<br>Body 0 (default)<br>Eyebrow / caption +0.5–2px uppercase<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"border:1px solid #DFDFDF;border-radius:6px;padding:16px 18px\">\n            <div style=\"font-size:13px;font-weight:700;color:#DA291C;margin-bottom:8px\">Mobile vs desktop<\u002Fdiv>\n            <div style=\"font-size:14px;line-height:1.75;color:#373A36\">H1 48→32px, H2 30→24px, P 20→18px on ≤640px. Body 16px holds everywhere; never below 12px. <span style=\"color:#B27C12;font-weight:600\">⚠ mobile ramp extends the guide.<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <p style=\"font-size:13px;color:#8b8d8a;margin:14px 0 0\">Note: H5 / H6 are intentionally undefined — the system uses H1–H4, body and caption only.<\u002Fp>\n      <\u002Fsection>\n\n      <!-- 04 SPACING & LAYOUT -->\n      <section id=\"spacing\">\n        <div style=\"display:flex;align-items:baseline;gap:14px;margin-bottom:8px\"><span style=\"font-size:14px;font-weight:700;color:#DA291C\">04<\u002Fspan><h2 style=\"font-size:30px;font-weight:700;color:#1C1D1B;margin:0;letter-spacing:-.4px\">Spacing &amp; Layout<\u002Fh2><\u002Fdiv>\n        <p style=\"font-size:18px;color:#696B68;margin:0 0 24px;max-width:640px\">Built on a <strong style=\"color:#373A36\">4px base unit<\u002Fstrong>. Use these steps for all padding, margin and gaps to keep rhythm consistent.<\u002Fp>\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-bottom:28px\">\n          <sc-for list=\"{{ spacing }}\" as=\"s\" hint-placeholder-count=\"8\">\n            <div style=\"border:1px solid #DFDFDF;border-radius:5px;padding:16px\">\n              <div style=\"height:16px;background:#DA291C;border-radius:3px;width:{{ s.px }}\"><\u002Fdiv>\n              <div style=\"margin-top:14px;font-size:13px;font-weight:700;color:#1C1D1B;font-family:'JetBrains Mono',monospace\">{{ s.name }}<\u002Fdiv>\n              <div style=\"font-size:13px;color:#696B68\">{{ s.px }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:24px\">\n          <div style=\"border:1px solid #DFDFDF;border-radius:6px;padding:18px 20px\">\n            <div style=\"font-size:16px;font-weight:600;color:#1C1D1B;margin-bottom:12px\">Grid &amp; containers<\u002Fdiv>\n            <sc-raw-table style=\"width:100%;border-collapse:collapse;font-size:14px\">\n              <sc-raw-tbody>\n                <sc-for list=\"{{ layoutSpecs }}\" as=\"l\" hint-placeholder-count=\"5\">\n                  <sc-raw-tr style=\"border-top:1px solid #EDEDED\"><sc-raw-td style=\"padding:9px 0;color:#696B68\">{{ l.k }}<\u002Fsc-raw-td><sc-raw-td style=\"padding:9px 0;text-align:right;color:#1C1D1B;font-weight:600;font-family:'JetBrains Mono',monospace\">{{ l.v }}<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n                <\u002Fsc-for>\n              <\u002Fsc-raw-tbody>\n            <\u002Fsc-raw-table>\n          <\u002Fdiv>\n          <div style=\"border:1px solid #DFDFDF;border-radius:6px;padding:18px 20px\">\n            <div style=\"font-size:16px;font-weight:600;color:#1C1D1B;margin-bottom:12px\">Rhythm rules<\u002Fdiv>\n            <div style=\"font-size:14px;color:#373A36;line-height:1.8\">Section gaps <strong>48px<\u002Fstrong> · block gaps <strong>24px<\u002Fstrong> · related items <strong>16px<\u002Fstrong>.<br>Card inner padding <strong>24px<\u002Fstrong> · compact UI <strong>16px<\u002Fstrong> · buttons <strong>12×28<\u002Fstrong>.<br>Page margin <strong>48px<\u002Fstrong> desktop → <strong>16px<\u002Fstrong> mobile.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <h3 style=\"font-size:16px;font-weight:600;color:#1C1D1B;margin:0 0 4px\">Responsive breakpoints<\u002Fh3>\n        <p style=\"font-size:14px;color:#696B68;margin:0 0 14px\"><span style=\"color:#B27C12;font-weight:600\">⚠ Extends the Style Guide<\u002Fspan> — standard breakpoints for the mobile + web scope stated in the brief.<\u002Fp>\n        <div style=\"border:1px solid #DFDFDF;border-radius:8px;overflow:hidden\">\n          <div style=\"display:grid;grid-template-columns:.7fr 1fr 1fr 2fr;background:#F5F5F4;font-size:12px;font-weight:700;color:#696B68;text-transform:uppercase;letter-spacing:.5px\">\n            <div style=\"padding:11px 16px\">Token<\u002Fdiv><div style=\"padding:11px 12px\">Min-width<\u002Fdiv><div style=\"padding:11px 12px\">Columns<\u002Fdiv><div style=\"padding:11px 12px\">Target<\u002Fdiv>\n          <\u002Fdiv>\n          <sc-for list=\"{{ breakpoints }}\" as=\"b\" hint-placeholder-count=\"4\">\n            <div style=\"display:grid;grid-template-columns:.7fr 1fr 1fr 2fr;border-top:1px solid #EDEDED;font-size:14px;align-items:center\">\n              <div style=\"padding:11px 16px;font-weight:700;color:#DA291C;font-family:'JetBrains Mono',monospace\">{{ b.token }}<\u002Fdiv>\n              <div style=\"padding:11px 12px;color:#1C1D1B;font-family:'JetBrains Mono',monospace\">{{ b.min }}<\u002Fdiv>\n              <div style=\"padding:11px 12px;color:#373A36\">{{ b.cols }}<\u002Fdiv>\n              <div style=\"padding:11px 12px;color:#696B68\">{{ b.target }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <!-- 05 SHAPE -->\n      <section id=\"shape\">\n        <div style=\"display:flex;align-items:baseline;gap:14px;margin-bottom:8px\"><span style=\"font-size:14px;font-weight:700;color:#DA291C\">05<\u002Fspan><h2 style=\"font-size:30px;font-weight:700;color:#1C1D1B;margin:0;letter-spacing:-.4px\">Shape &amp; Visual Style<\u002Fh2><\u002Fdiv>\n        <p style=\"font-size:18px;color:#696B68;margin:0 0 24px;max-width:640px\">Softly rounded, quiet surfaces, restrained elevation. Shape carries calm reliability; red carries emphasis.<\u002Fp>\n        <h3 style=\"font-size:16px;font-weight:600;color:#1C1D1B;margin:0 0 14px\">Radius<\u002Fh3>\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:14px;margin-bottom:28px\">\n          <sc-for list=\"{{ radii }}\" as=\"r\" hint-placeholder-count=\"4\">\n            <div style=\"text-align:center\">\n              <div style=\"height:78px;background:#FBECEB;border:1.5px solid #DA291C;border-bottom:none;border-radius:{{ r.val }} {{ r.val }} 0 0\"><\u002Fdiv>\n              <div style=\"border:1px solid #EDEDED;border-top:none;border-radius:0 0 6px 6px;padding:10px\">\n                <div style=\"font-size:13px;font-weight:700;color:#1C1D1B;font-family:'JetBrains Mono',monospace\">{{ r.name }}<\u002Fdiv>\n                <div style=\"font-size:12px;color:#696B68\">{{ r.val }} · {{ r.use }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:24px\">\n          <div style=\"border:1px solid #DFDFDF;border-radius:6px;padding:18px 20px\">\n            <div style=\"font-size:16px;font-weight:600;color:#1C1D1B;margin-bottom:12px\">Borders &amp; dividers<\u002Fdiv>\n            <div style=\"font-size:14px;color:#373A36;line-height:1.8\">Default border <strong>1px #DFDFDF<\u002Fstrong> · subtle <strong>1px #EDEDED<\u002Fstrong>.<br>Interactive outline <strong>1.5px<\u002Fstrong> (outline buttons, focus).<br>Dividers 1px #EDEDED, full-bleed. Section accent = 4px left/top red or gold.<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"border:1px solid #DFDFDF;border-radius:6px;padding:18px 20px\">\n            <div style=\"font-size:16px;font-weight:600;color:#1C1D1B;margin-bottom:12px\">Icons &amp; imagery<\u002Fdiv>\n            <div style=\"font-size:14px;color:#373A36;line-height:1.8\">Icons: line style, 1.5–2px stroke, 24px grid, rounded joins. Key icons red, default charcoal.<br>Photography: hi-res, warm reds/charcoal/gray tones, authentic human moments. Prefer photos over video.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <h3 style=\"font-size:16px;font-weight:600;color:#1C1D1B;margin:0 0 4px\">Shadows &amp; elevation<\u002Fh3>\n        <p style=\"font-size:14px;color:#696B68;margin:0 0 16px\">Flat by default. Elevation only for layers that float above the page. Modal shadow is defined by the guide; <span style=\"color:#B27C12;font-weight:600\">⚠ sm/md steps extend it.<\u002Fspan><\u002Fp>\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:20px;background:#F5F5F4;border-radius:8px;padding:28px\">\n          <sc-for list=\"{{ shadows }}\" as=\"s\" hint-placeholder-count=\"3\">\n            <div style=\"background:#fff;border-radius:8px;padding:18px;box-shadow:{{ s.val }}\">\n              <div style=\"font-size:14px;font-weight:700;color:#1C1D1B\">{{ s.name }}<\u002Fdiv>\n              <div style=\"font-size:12px;color:#696B68;margin-top:4px\">{{ s.use }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <!-- 06 TOKENS -->\n      <section id=\"tokens\">\n        <div style=\"display:flex;align-items:baseline;gap:14px;margin-bottom:8px\"><span style=\"font-size:14px;font-weight:700;color:#DA291C\">06<\u002Fspan><h2 style=\"font-size:30px;font-weight:700;color:#1C1D1B;margin:0;letter-spacing:-.4px\">Core Design Tokens<\u002Fh2><\u002Fdiv>\n        <p style=\"font-size:18px;color:#696B68;margin:0 0 22px;max-width:660px\">One reusable naming structure for Figma variables, CSS and code. Group / role / modifier — e.g. <span style=\"font-family:'JetBrains Mono',monospace;font-size:15px;color:#373A36\">color/primary/hover<\u002Fspan>.<\u002Fp>\n        <div style=\"display:flex;gap:8px;margin-bottom:16px\">\n          <sc-for list=\"{{ tokenTabs }}\" as=\"tt\" hint-placeholder-count=\"3\">\n            <button sc-camel-on-click=\"{{ tt.onClick }}\" style=\"padding:8px 18px;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;border:1px solid {{ tt.border }};background:{{ tt.bg }};color:{{ tt.color }}\">{{ tt.label }}<\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <pre style=\"margin:0;background:#1C1D1B;color:#e7e5e2;border-radius:10px;padding:22px 24px;font-family:'JetBrains Mono',monospace;font-size:13px;line-height:1.65;overflow-x:auto;white-space:pre\">{{ tokenCode }}<\u002Fpre>\n        <p style=\"font-size:13px;color:#8b8d8a;margin:12px 0 0\">Full token set: color · typography · spacing · radius · border · shadow · breakpoints · motion. Names map 1:1 across Figma variables (<span style=\"font-family:'JetBrains Mono',monospace\">group/role<\u002Fspan>), CSS custom properties (<span style=\"font-family:'JetBrains Mono',monospace\">--group-role<\u002Fspan>) and JSON design tokens.<\u002Fp>\n      <\u002Fsection>\n\n      <!-- 07 COMPONENTS -->\n      <section id=\"components\">\n        <div style=\"display:flex;align-items:baseline;gap:14px;margin-bottom:8px\"><span style=\"font-size:14px;font-weight:700;color:#DA291C\">07<\u002Fspan><h2 style=\"font-size:30px;font-weight:700;color:#1C1D1B;margin:0;letter-spacing:-.4px\">Core Components<\u002Fh2><\u002Fdiv>\n        <p style=\"font-size:18px;color:#696B68;margin:0 0 28px;max-width:660px\">The minimum standard set. Each shows purpose, variants, states and usage — built with live examples on the tokens above.<\u002Fp>\n\n        <!-- Buttons -->\n        <div style=\"border:1px solid #DFDFDF;border-radius:8px;padding:26px;margin-bottom:20px\">\n          <div style=\"display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:8px;margin-bottom:6px\"><h3 style=\"font-size:18px;font-weight:600;color:#1C1D1B;margin:0\">Buttons<\u002Fh3><span style=\"font-size:13px;color:#696B68\">Primary · Secondary (outline) · Ghost · Premium · sizes S/M/L · states<\u002Fspan><\u002Fdiv>\n          <p style=\"font-size:14px;color:#696B68;margin:0 0 18px\">One primary action per view. Radius 8px, 14px SemiBold label, pad 12×28 (M).<\u002Fp>\n          <div style=\"display:flex;flex-wrap:wrap;align-items:center;gap:14px;margin-bottom:18px\">\n            <button style=\"background:#DA291C;color:#fff;border:none;border-radius:8px;padding:12px 28px;font:600 14px 'Be Vietnam Pro';cursor:pointer;transition:background .2s\" style-hover=\"background:#A31F15\">Primary<\u002Fbutton>\n            <button style=\"background:#fff;color:#DA291C;border:1.5px solid #DA291C;border-radius:8px;padding:11px 28px;font:600 14px 'Be Vietnam Pro';cursor:pointer;transition:.2s\" style-hover=\"background:#F6C9C6\">Secondary<\u002Fbutton>\n            <button style=\"background:none;color:#DA291C;border:none;padding:12px 8px;font:600 14px 'Be Vietnam Pro';cursor:pointer\" style-hover=\"color:#A31F15\">Learn more ›<\u002Fbutton>\n            <button style=\"background:#D7A44C;color:#1C1D1B;border:none;border-radius:8px;padding:12px 28px;font:600 14px 'Be Vietnam Pro';cursor:pointer\">Premium CTA<\u002Fbutton>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-wrap:wrap;align-items:center;gap:14px;padding-top:18px;border-top:1px solid #EDEDED\">\n            <button style=\"background:#DA291C;color:#fff;border:none;border-radius:8px;padding:8px 20px;font:600 13px 'Be Vietnam Pro';cursor:pointer\">Small<\u002Fbutton>\n            <button style=\"background:#DA291C;color:#fff;border:none;border-radius:8px;padding:12px 28px;font:600 14px 'Be Vietnam Pro';cursor:pointer\">Medium<\u002Fbutton>\n            <button style=\"background:#DA291C;color:#fff;border:none;border-radius:8px;padding:16px 36px;font:600 15px 'Be Vietnam Pro';cursor:pointer\">Large<\u002Fbutton>\n            <span style=\"width:1px;height:28px;background:#EDEDED\"><\u002Fspan>\n            <button style=\"background:#A31F15;color:#fff;border:none;border-radius:8px;padding:12px 28px;font:600 14px 'Be Vietnam Pro';cursor:pointer\">Hover<\u002Fbutton>\n            <button disabled=\"\" style=\"background:#DA291C;opacity:.45;color:#fff;border:none;border-radius:8px;padding:12px 28px;font:600 14px 'Be Vietnam Pro';cursor:not-allowed\">Disabled<\u002Fbutton>\n            <button style=\"background:#DA291C;color:#fff;border:none;border-radius:8px;padding:12px 28px;font:600 14px 'Be Vietnam Pro';cursor:progress;display:inline-flex;align-items:center;gap:9px\"><span style=\"width:14px;height:14px;border:2px solid rgba(255,255,255,.5);border-top-color:#fff;border-radius:50%;animation:vp-spin .7s linear infinite\"><\u002Fspan>Loading<\u002Fbutton>\n          <\u002Fdiv>\n          <div style=\"font-size:13px;color:#696B68;margin-top:16px;line-height:1.6\"><strong style=\"color:#373A36\">A11y<\u002Fstrong> — real <span style=\"font-family:'JetBrains Mono',monospace\">&lt;button&gt;<\u002Fspan>, ≥44px hit target, visible focus ring, never rely on color alone. Icon+text: 8px gap. Premium uses <span style=\"font-family:'JetBrains Mono',monospace\">#1C1D1B<\u002Fspan> text — never white.<\u002Fdiv>\n        <\u002Fdiv>\n\n        <!-- Inputs row -->\n        <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:20px\">\n          <div style=\"border:1px solid #DFDFDF;border-radius:8px;padding:26px\">\n            <h3 style=\"font-size:18px;font-weight:600;color:#1C1D1B;margin:0 0 4px\">Input fields<\u002Fh3>\n            <p style=\"font-size:14px;color:#696B68;margin:0 0 18px\">Default · focus · error · disabled. Height 40–44px, radius 8px.<\u002Fp>\n            <div style=\"display:flex;flex-direction:column;gap:16px\">\n              <label style=\"display:block\"><span style=\"font-size:13px;font-weight:600;color:#373A36;display:block;margin-bottom:6px\">Card number<\u002Fspan><input value=\"0000 0000 0000\" style=\"width:100%;height:44px;padding:0 14px;border:1px solid #DFDFDF;border-radius:8px;font:400 14px 'Be Vietnam Pro';color:#1C1D1B;outline:none\" style-focus=\"border-color:#DA291C;box-shadow:0 0 0 3px #F6C9C6\"><span style=\"font-size:12px;color:#696B68;display:block;margin-top:6px\">16-digit number on the front of your card.<\u002Fspan><\u002Flabel>\n              <label style=\"display:block\"><span style=\"font-size:13px;font-weight:600;color:#373A36;display:block;margin-bottom:6px\">Invalid input<\u002Fspan><input value=\"0000 0000\" style=\"width:100%;height:44px;padding:0 14px;background:#F6C9C6;border:1px solid #A31F15;border-radius:8px;font:400 14px 'Be Vietnam Pro';color:#A31F15;outline:none\"><span style=\"font-size:12px;color:#A31F15;display:block;margin-top:6px;font-weight:500\">✕ Please check your card details.<\u002Fspan><\u002Flabel>\n              <label style=\"display:block\"><span style=\"font-size:13px;font-weight:600;color:#8b8d8a;display:block;margin-bottom:6px\">Disabled<\u002Fspan><input value=\"Locked\" disabled=\"\" style=\"width:100%;height:44px;padding:0 14px;background:#F5F5F4;border:1px solid #DFDFDF;border-radius:8px;font:400 14px 'Be Vietnam Pro';color:#8b8d8a;cursor:not-allowed\"><\u002Flabel>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"border:1px solid #DFDFDF;border-radius:8px;padding:26px\">\n            <h3 style=\"font-size:18px;font-weight:600;color:#1C1D1B;margin:0 0 4px\">Text area &amp; Select<\u002Fh3>\n            <p style=\"font-size:14px;color:#696B68;margin:0 0 18px\">Multi-line entry and single-choice menu.<\u002Fp>\n            <div style=\"display:flex;flex-direction:column;gap:16px\">\n              <label style=\"display:block\"><span style=\"font-size:13px;font-weight:600;color:#373A36;display:block;margin-bottom:6px\">Note to recipient<\u002Fspan><textarea rows=\"3\" style=\"width:100%;padding:12px 14px;border:1px solid #DFDFDF;border-radius:8px;font:400 14px 'Be Vietnam Pro';color:#1C1D1B;resize:vertical;outline:none\" style-focus=\"border-color:#DA291C;box-shadow:0 0 0 3px #F6C9C6\">Thanks for lunch!<\u002Ftextarea><\u002Flabel>\n              <label style=\"display:block\"><span style=\"font-size:13px;font-weight:600;color:#373A36;display:block;margin-bottom:6px\">Account<\u002Fspan>\n                <div style=\"position:relative\">\n                  <sc-raw-select style=\"width:100%;height:44px;padding:0 40px 0 14px;border:1px solid #DFDFDF;border-radius:8px;font:400 14px 'Be Vietnam Pro';color:#1C1D1B;appearance:none;background:#fff;outline:none;cursor:pointer\" style-focus=\"border-color:#DA291C;box-shadow:0 0 0 3px #F6C9C6\"><option>Checking · ••4821<\u002Foption><option>Savings · ••9930<\u002Foption><\u002Fsc-raw-select>\n                  <span style=\"position:absolute;right:14px;top:50%;transform:translateY(-50%);color:#696B68;pointer-events:none;font-size:12px\">▾<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Flabel>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <!-- Selection controls -->\n        <div style=\"border:1px solid #DFDFDF;border-radius:8px;padding:26px;margin-bottom:20px\">\n          <h3 style=\"font-size:18px;font-weight:600;color:#1C1D1B;margin:0 0 4px\">Checkbox · Radio · Switch<\u002Fh3>\n          <p style=\"font-size:14px;color:#696B68;margin:0 0 18px\">Selected state uses primary red. All are keyboard-operable and label-linked. Live — click them.<\u002Fp>\n          <div style=\"display:flex;flex-wrap:wrap;gap:40px\">\n            <div style=\"display:flex;flex-direction:column;gap:12px\">\n              <div style=\"font-size:13px;font-weight:600;color:#696B68;text-transform:uppercase;letter-spacing:.5px\">Checkbox<\u002Fdiv>\n              <label sc-camel-on-click=\"{{ toggleChk1 }}\" style=\"display:flex;align-items:center;gap:10px;cursor:pointer;font-size:14px;color:#373A36\">\n                <span style=\"width:20px;height:20px;border-radius:5px;border:1.5px solid {{ chk1Border }};background:{{ chk1Bg }};display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px\">{{ chk1Mark }}<\u002Fspan>Save this card\n              <\u002Flabel>\n              <label sc-camel-on-click=\"{{ toggleChk2 }}\" style=\"display:flex;align-items:center;gap:10px;cursor:pointer;font-size:14px;color:#373A36\">\n                <span style=\"width:20px;height:20px;border-radius:5px;border:1.5px solid {{ chk2Border }};background:{{ chk2Bg }};display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px\">{{ chk2Mark }}<\u002Fspan>Email receipts\n              <\u002Flabel>\n            <\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:12px\">\n              <div style=\"font-size:13px;font-weight:600;color:#696B68;text-transform:uppercase;letter-spacing:.5px\">Radio<\u002Fdiv>\n              <sc-for list=\"{{ radioOpts }}\" as=\"o\" hint-placeholder-count=\"2\">\n                <label sc-camel-on-click=\"{{ o.onClick }}\" style=\"display:flex;align-items:center;gap:10px;cursor:pointer;font-size:14px;color:#373A36\">\n                  <span style=\"width:20px;height:20px;border-radius:50%;border:1.5px solid {{ o.border }};display:flex;align-items:center;justify-content:center\"><span style=\"width:10px;height:10px;border-radius:50%;background:{{ o.dot }}\"><\u002Fspan><\u002Fspan>{{ o.label }}\n                <\u002Flabel>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:12px\">\n              <div style=\"font-size:13px;font-weight:600;color:#696B68;text-transform:uppercase;letter-spacing:.5px\">Switch<\u002Fdiv>\n              <label sc-camel-on-click=\"{{ toggleSw }}\" style=\"display:flex;align-items:center;gap:12px;cursor:pointer;font-size:14px;color:#373A36\">\n                <span style=\"width:44px;height:26px;border-radius:999px;background:{{ swBg }};position:relative;transition:background .2s\"><span style=\"position:absolute;top:3px;left:{{ swX }};width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:left .2s\"><\u002Fspan><\u002Fspan>Biometric login {{ swLabel }}\n              <\u002Flabel>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <!-- Card + Tabs -->\n        <div style=\"display:grid;grid-template-columns:1fr 1.2fr;gap:20px;margin-bottom:20px\">\n          <div style=\"border:1px solid #DFDFDF;border-radius:8px;padding:26px\">\n            <h3 style=\"font-size:18px;font-weight:600;color:#1C1D1B;margin:0 0 4px\">Card<\u002Fh3>\n            <p style=\"font-size:14px;color:#696B68;margin:0 0 18px\">Radius 6px, border 1px #DFDFDF, inner padding 24px.<\u002Fp>\n            <div style=\"border:1px solid #DFDFDF;border-radius:6px;overflow:hidden\">\n              <div style=\"background:#DA291C;height:8px\"><\u002Fdiv>\n              <div style=\"padding:24px\">\n                <div style=\"display:flex;justify-content:space-between;align-items:center;margin-bottom:8px\"><div style=\"font-size:14px;color:#696B68\">Total saved this year<\u002Fdiv><span style=\"font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:#fff;background:#D7A44C;padding:3px 9px;border-radius:999px\">VIP<\u002Fspan><\u002Fdiv>\n                <div style=\"font-size:30px;font-weight:700;color:#1C1D1B;letter-spacing:-.5px\">₫12.4M<\u002Fdiv>\n                <div style=\"border-top:3px solid #D7A44C;margin:16px 0 12px\"><\u002Fdiv>\n                <button style=\"background:#DA291C;color:#fff;border:none;border-radius:8px;padding:10px 20px;font:600 14px 'Be Vietnam Pro';cursor:pointer\">Add funds<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"border:1px solid #DFDFDF;border-radius:8px;padding:26px\">\n            <h3 style=\"font-size:18px;font-weight:600;color:#1C1D1B;margin:0 0 4px\">Tabs<\u002Fh3>\n            <p style=\"font-size:14px;color:#696B68;margin:0 0 18px\">Underline indicator in red on the active tab. Live — click.<\u002Fp>\n            <div style=\"display:flex;gap:4px;border-bottom:1px solid #DFDFDF\">\n              <sc-for list=\"{{ tabs }}\" as=\"t\" hint-placeholder-count=\"3\">\n                <button sc-camel-on-click=\"{{ t.onClick }}\" style=\"background:none;border:none;padding:11px 16px;font:600 14px 'Be Vietnam Pro';cursor:pointer;color:{{ t.color }};border-bottom:2px solid {{ t.underline }};margin-bottom:-1px\">{{ t.label }}<\u002Fbutton>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <div style=\"padding:20px 2px;font-size:15px;color:#373A36;line-height:1.6\">{{ tabBody }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <!-- Navigation -->\n        <div style=\"border:1px solid #DFDFDF;border-radius:8px;padding:26px;margin-bottom:20px\">\n          <h3 style=\"font-size:18px;font-weight:600;color:#1C1D1B;margin:0 0 4px\">Navigation<\u002Fh3>\n          <p style=\"font-size:14px;color:#696B68;margin:0 0 18px\">Desktop top bar and mobile bottom tab bar. Active item in red; ≥44px targets on mobile.<\u002Fp>\n          <div style=\"border:1px solid #EDEDED;border-radius:8px;overflow:hidden;margin-bottom:16px\">\n            <div style=\"display:flex;align-items:center;gap:26px;padding:0 20px;height:60px;background:#fff;border-bottom:1px solid #EDEDED\">\n              <div style=\"display:flex;align-items:center;gap:8px;font-weight:700;color:#1C1D1B\"><span style=\"width:26px;height:26px;border-radius:6px;background:#DA291C;color:#fff;display:flex;align-items:center;justify-content:center;font-size:14px\">V<\u002Fspan>VietPay<\u002Fdiv>\n              <div style=\"display:flex;gap:22px;font-size:14px;font-weight:500\">\n                <span style=\"color:#DA291C;font-weight:600;border-bottom:2px solid #DA291C;padding-bottom:19px\">Home<\u002Fspan>\n                <span style=\"color:#696B68\">Transfer<\u002Fspan><span style=\"color:#696B68\">Cards<\u002Fspan><span style=\"color:#696B68\">Rewards<\u002Fspan>\n              <\u002Fdiv>\n              <button style=\"margin-left:auto;background:#DA291C;color:#fff;border:none;border-radius:8px;padding:8px 18px;font:600 13px 'Be Vietnam Pro';cursor:pointer\">Send money<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"max-width:300px;border:1px solid #EDEDED;border-radius:12px;overflow:hidden\">\n            <div style=\"display:flex;justify-content:space-around;padding:8px 6px;background:#fff;border-top:1px solid #EDEDED\">\n              <sc-for list=\"{{ bottomNav }}\" as=\"n\" hint-placeholder-count=\"4\">\n                <div style=\"display:flex;flex-direction:column;align-items:center;gap:4px;min-width:44px;padding:6px 4px\">\n                  <span style=\"width:22px;height:22px;border-radius:6px;background:{{ n.icon }}\"><\u002Fspan>\n                  <span style=\"font-size:11px;font-weight:600;color:{{ n.color }}\">{{ n.label }}<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <!-- Modal + Tooltip -->\n        <div style=\"display:grid;grid-template-columns:1.2fr 1fr;gap:20px;margin-bottom:20px\">\n          <div style=\"border:1px solid #DFDFDF;border-radius:8px;padding:26px\">\n            <h3 style=\"font-size:18px;font-weight:600;color:#1C1D1B;margin:0 0 4px\">Modal<\u002Fh3>\n            <p style=\"font-size:14px;color:#696B68;margin:0 0 18px\">Centered card over a 50% scrim. Radius 8px, padding 32px, max-width 460px. Actions bottom-right, primary last.<\u002Fp>\n            <button sc-camel-on-click=\"{{ openModal }}\" style=\"background:#DA291C;color:#fff;border:none;border-radius:8px;padding:12px 28px;font:600 14px 'Be Vietnam Pro';cursor:pointer\">Preview modal<\u002Fbutton>\n            <div style=\"font-size:13px;color:#696B68;margin-top:14px;line-height:1.6\">Scrim <span style=\"font-family:'JetBrains Mono',monospace\">rgba(0,0,0,.5)<\u002Fspan> · shadow <span style=\"font-family:'JetBrains Mono',monospace\">0 20px 48px rgba(0,0,0,.28)<\u002Fspan> · closes on scrim click, Cancel or Esc.<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"border:1px solid #DFDFDF;border-radius:8px;padding:26px\">\n            <h3 style=\"font-size:18px;font-weight:600;color:#1C1D1B;margin:0 0 4px\">Tooltip<\u002Fh3>\n            <p style=\"font-size:14px;color:#696B68;margin:0 0 18px\">Short, on hover/focus. Dark surface, 6px radius. Hover the chip.<\u002Fp>\n            <div style=\"position:relative;display:inline-block\">\n              <span sc-camel-on-mouse-enter=\"{{ showTip }}\" sc-camel-on-mouse-leave=\"{{ hideTip }}\" style=\"display:inline-flex;align-items:center;gap:7px;font-size:14px;color:#373A36;cursor:help;border-bottom:1px dashed #696B68;padding-bottom:2px\">What's an APR?<span style=\"width:16px;height:16px;border-radius:50%;background:#F5F5F4;border:1px solid #DFDFDF;font-size:11px;font-weight:700;color:#696B68;display:inline-flex;align-items:center;justify-content:center\">?<\u002Fspan><\u002Fspan>\n              <sc-if value=\"{{ tip }}\" hint-placeholder-val=\"{{ false }}\">\n                <span style=\"position:absolute;bottom:calc(100% + 8px);left:0;background:#1C1D1B;color:#fff;font-size:12px;line-height:1.5;padding:8px 12px;border-radius:6px;width:200px;box-shadow:0 4px 12px rgba(0,0,0,.2)\">Annual Percentage Rate — the yearly cost of borrowing, shown as a percentage.<\u002Fspan>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <!-- Alerts + Badges -->\n        <div style=\"border:1px solid #DFDFDF;border-radius:8px;padding:26px;margin-bottom:20px\">\n          <h3 style=\"font-size:18px;font-weight:600;color:#1C1D1B;margin:0 0 4px\">Alerts &amp; Badges<\u002Fh3>\n          <p style=\"font-size:14px;color:#696B68;margin:0 0 18px\">Meaning comes from the icon, text and border — surface only tints. Error is guide-defined; other statuses <span style=\"color:#B27C12;font-weight:600\">⚠ extend it.<\u002Fspan><\u002Fp>\n          <div style=\"display:flex;flex-direction:column;gap:12px;margin-bottom:20px\">\n            <sc-for list=\"{{ alerts }}\" as=\"a\" hint-placeholder-count=\"4\">\n              <div style=\"display:flex;gap:12px;align-items:flex-start;background:{{ a.surface }};border:1px solid {{ a.solid }};border-radius:8px;padding:13px 16px\">\n                <span style=\"font-size:16px;color:{{ a.solid }};line-height:1.3\">{{ a.icon }}<\u002Fspan>\n                <div><div style=\"font-size:14px;font-weight:600;color:{{ a.solid }}\">{{ a.title }}<\u002Fdiv><div style=\"font-size:13px;color:#373A36;margin-top:2px\">{{ a.body }}<\u002Fdiv><\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-wrap:wrap;align-items:center;gap:10px\">\n            <span style=\"font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:#fff;background:#D7A44C;padding:4px 11px;border-radius:999px\">VIP<\u002Fspan>\n            <span style=\"font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:#D7A44C;background:#fff;border:1px solid #D7A44C;padding:3px 11px;border-radius:999px\">New<\u002Fspan>\n            <span style=\"font-size:12px;font-weight:600;color:#2E7D5B;background:#DCEEE4;padding:4px 11px;border-radius:999px;display:inline-flex;align-items:center;gap:6px\"><span style=\"width:7px;height:7px;border-radius:50%;background:#2E7D5B\"><\u002Fspan>Active<\u002Fspan>\n            <span style=\"font-size:12px;font-weight:600;color:#A31F15;background:#F6C9C6;padding:4px 11px;border-radius:999px\">Failed<\u002Fspan>\n            <span style=\"font-size:12px;font-weight:600;color:#696B68;background:#F5F5F4;border:1px solid #DFDFDF;padding:4px 11px;border-radius:999px\">3 new<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <!-- Table + Pagination -->\n        <div style=\"border:1px solid #DFDFDF;border-radius:8px;padding:26px;margin-bottom:20px\">\n          <h3 style=\"font-size:18px;font-weight:600;color:#1C1D1B;margin:0 0 4px\">Table &amp; Pagination<\u002Fh3>\n          <p style=\"font-size:14px;color:#696B68;margin:0 0 18px\">Left-aligned text, right-aligned figures, 1px row dividers, zebra optional. Pagination active page in red — live.<\u002Fp>\n          <div style=\"border:1px solid #EDEDED;border-radius:8px;overflow:hidden\">\n            <sc-raw-table style=\"width:100%;border-collapse:collapse;font-size:14px\">\n              <sc-raw-thead><sc-raw-tr style=\"background:#F5F5F4\"><sc-raw-th style=\"text-align:left;padding:11px 16px;font-size:12px;font-weight:700;color:#696B68;text-transform:uppercase;letter-spacing:.5px\">Date<\u002Fsc-raw-th><sc-raw-th style=\"text-align:left;padding:11px 16px;font-size:12px;font-weight:700;color:#696B68;text-transform:uppercase;letter-spacing:.5px\">Merchant<\u002Fsc-raw-th><sc-raw-th style=\"text-align:left;padding:11px 16px;font-size:12px;font-weight:700;color:#696B68;text-transform:uppercase;letter-spacing:.5px\">Status<\u002Fsc-raw-th><sc-raw-th style=\"text-align:right;padding:11px 16px;font-size:12px;font-weight:700;color:#696B68;text-transform:uppercase;letter-spacing:.5px\">Amount<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n              <sc-raw-tbody>\n                <sc-for list=\"{{ rows }}\" as=\"r\" hint-placeholder-count=\"3\">\n                  <sc-raw-tr style=\"border-top:1px solid #EDEDED\"><sc-raw-td style=\"padding:13px 16px;color:#696B68\">{{ r.date }}<\u002Fsc-raw-td><sc-raw-td style=\"padding:13px 16px;color:#1C1D1B;font-weight:500\">{{ r.merchant }}<\u002Fsc-raw-td><sc-raw-td style=\"padding:13px 16px\"><span style=\"font-size:12px;font-weight:600;color:{{ r.statusColor }};background:{{ r.statusBg }};padding:3px 10px;border-radius:999px\">{{ r.status }}<\u002Fspan><\u002Fsc-raw-td><sc-raw-td style=\"padding:13px 16px;text-align:right;font-weight:600;color:#1C1D1B;font-variant-numeric:tabular-nums\">{{ r.amount }}<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n                <\u002Fsc-for>\n              <\u002Fsc-raw-tbody>\n            <\u002Fsc-raw-table>\n          <\u002Fdiv>\n          <div style=\"display:flex;justify-content:flex-end;align-items:center;gap:6px;margin-top:16px\">\n            <sc-for list=\"{{ pages }}\" as=\"p\" hint-placeholder-count=\"6\">\n              <button sc-camel-on-click=\"{{ p.onClick }}\" style=\"min-width:36px;height:36px;border-radius:8px;border:1px solid {{ p.border }};background:{{ p.bg }};color:{{ p.color }};font:600 14px 'Be Vietnam Pro';cursor:pointer\">{{ p.label }}<\u002Fbutton>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <!-- Loading + Empty -->\n        <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:20px\">\n          <div style=\"border:1px solid #DFDFDF;border-radius:8px;padding:26px\">\n            <h3 style=\"font-size:18px;font-weight:600;color:#1C1D1B;margin:0 0 4px\">Loading states<\u002Fh3>\n            <p style=\"font-size:14px;color:#696B68;margin:0 0 18px\">Spinner for actions, skeleton for content. Never block the whole screen for &lt;1s waits.<\u002Fp>\n            <div style=\"display:flex;align-items:center;gap:24px;margin-bottom:20px\">\n              <span style=\"width:28px;height:28px;border:3px solid #F6C9C6;border-top-color:#DA291C;border-radius:50%;animation:vp-spin .7s linear infinite\"><\u002Fspan>\n              <span style=\"font-size:14px;color:#696B68\">Processing payment…<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:10px\">\n              <div style=\"height:14px;width:70%;border-radius:5px;background:linear-gradient(90deg,#EDEDED 25%,#F5F5F4 37%,#EDEDED 63%);background-size:320px 100%;animation:vp-shimmer 1.3s infinite linear\"><\u002Fdiv>\n              <div style=\"height:14px;width:100%;border-radius:5px;background:linear-gradient(90deg,#EDEDED 25%,#F5F5F4 37%,#EDEDED 63%);background-size:320px 100%;animation:vp-shimmer 1.3s infinite linear\"><\u002Fdiv>\n              <div style=\"height:14px;width:45%;border-radius:5px;background:linear-gradient(90deg,#EDEDED 25%,#F5F5F4 37%,#EDEDED 63%);background-size:320px 100%;animation:vp-shimmer 1.3s infinite linear\"><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"border:1px solid #DFDFDF;border-radius:8px;padding:26px\">\n            <h3 style=\"font-size:18px;font-weight:600;color:#1C1D1B;margin:0 0 4px\">Empty states<\u002Fh3>\n            <p style=\"font-size:14px;color:#696B68;margin:0 0 18px\">Explain what's missing and offer one clear next action.<\u002Fp>\n            <div style=\"text-align:center;padding:26px 20px;border:1px dashed #DFDFDF;border-radius:8px\">\n              <div style=\"width:52px;height:52px;border-radius:14px;background:#FBECEB;display:inline-flex;align-items:center;justify-content:center;font-size:24px;margin-bottom:14px\">✦<\u002Fdiv>\n              <div style=\"font-size:16px;font-weight:600;color:#1C1D1B\">No transactions yet<\u002Fdiv>\n              <div style=\"font-size:14px;color:#696B68;margin:6px 0 16px\">Your payments will appear here once you send or receive money.<\u002Fdiv>\n              <button style=\"background:#DA291C;color:#fff;border:none;border-radius:8px;padding:10px 22px;font:600 14px 'Be Vietnam Pro';cursor:pointer\">Send your first payment<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <!-- 08 INTERACTION & MOTION -->\n      <section id=\"motion\">\n        <div style=\"display:flex;align-items:baseline;gap:14px;margin-bottom:8px\"><span style=\"font-size:14px;font-weight:700;color:#DA291C\">08<\u002Fspan><h2 style=\"font-size:30px;font-weight:700;color:#1C1D1B;margin:0;letter-spacing:-.4px\">Interaction &amp; Motion<\u002Fh2><\u002Fdiv>\n        <p style=\"font-size:18px;color:#696B68;margin:0 0 24px;max-width:660px\">Motion supports clarity and responsiveness — never decorative. Fast, purposeful, and always respecting reduced-motion. <span style=\"color:#B27C12;font-weight:600\">⚠ Timing values extend the guide.<\u002Fspan><\u002Fp>\n        <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:20px\">\n          <div style=\"border:1px solid #DFDFDF;border-radius:8px;overflow:hidden\">\n            <div style=\"padding:14px 20px;background:#F5F5F4;font-size:13px;font-weight:700;color:#696B68;text-transform:uppercase;letter-spacing:.5px\">Interactive states<\u002Fdiv>\n            <sc-for list=\"{{ states }}\" as=\"s\" hint-placeholder-count=\"6\">\n              <div style=\"display:flex;justify-content:space-between;gap:16px;padding:12px 20px;border-top:1px solid #EDEDED;font-size:14px\"><span style=\"font-weight:600;color:#1C1D1B\">{{ s.k }}<\u002Fspan><span style=\"color:#696B68;text-align:right\">{{ s.v }}<\u002Fspan><\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <div style=\"border:1px solid #DFDFDF;border-radius:8px;overflow:hidden\">\n            <div style=\"padding:14px 20px;background:#F5F5F4;font-size:13px;font-weight:700;color:#696B68;text-transform:uppercase;letter-spacing:.5px\">Duration &amp; easing<\u002Fdiv>\n            <sc-for list=\"{{ motionSpecs }}\" as=\"m\" hint-placeholder-count=\"5\">\n              <div style=\"display:flex;justify-content:space-between;gap:16px;padding:12px 20px;border-top:1px solid #EDEDED;font-size:14px\"><span style=\"font-weight:600;color:#1C1D1B\">{{ m.k }}<\u002Fspan><span style=\"color:#696B68;font-family:'JetBrains Mono',monospace;text-align:right\">{{ m.v }}<\u002Fspan><\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"border:1px solid #DFDFDF;border-radius:6px;border-left:4px solid #DA291C;padding:14px 18px;font-size:14px;color:#373A36;line-height:1.6\"><strong style=\"color:#1C1D1B\">Feedback<\u002Fstrong> — every action confirms within 100ms (state change, spinner or toast). Success is quiet; errors are explicit. Keep transitions ≤320ms so the UI feels agile, never sluggish.<\u002Fdiv>\n      <\u002Fsection>\n\n      <!-- 09 UX WRITING -->\n      <section id=\"writing\">\n        <div style=\"display:flex;align-items:baseline;gap:14px;margin-bottom:8px\"><span style=\"font-size:14px;font-weight:700;color:#DA291C\">09<\u002Fspan><h2 style=\"font-size:30px;font-weight:700;color:#1C1D1B;margin:0;letter-spacing:-.4px\">UX Writing<\u002Fh2><\u002Fdiv>\n        <p style=\"font-size:18px;color:#696B68;margin:0 0 24px;max-width:660px\">Voice: confident yet friendly, concise, action-oriented, focused on customer outcomes. Write for a person completing a task.<\u002Fp>\n        <div style=\"border:1px solid #DFDFDF;border-radius:8px;overflow:hidden\">\n          <div style=\"display:grid;grid-template-columns:.9fr 1.1fr 1.1fr;background:#F5F5F4;font-size:12px;font-weight:700;color:#696B68;text-transform:uppercase;letter-spacing:.5px\">\n            <div style=\"padding:11px 16px\">Element<\u002Fdiv><div style=\"padding:11px 16px;color:#2E7D5B\">Do<\u002Fdiv><div style=\"padding:11px 16px;color:#A31F15\">Don't<\u002Fdiv>\n          <\u002Fdiv>\n          <sc-for list=\"{{ writing }}\" as=\"w\" hint-placeholder-count=\"7\">\n            <div style=\"display:grid;grid-template-columns:.9fr 1.1fr 1.1fr;border-top:1px solid #EDEDED;font-size:14px\">\n              <div style=\"padding:13px 16px;font-weight:600;color:#1C1D1B\">{{ w.el }}<\u002Fdiv>\n              <div style=\"padding:13px 16px;color:#373A36\">{{ w.do }}<\u002Fdiv>\n              <div style=\"padding:13px 16px;color:#8b8d8a\">{{ w.dont }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <!-- 10 ACCESSIBILITY -->\n      <section id=\"a11y\">\n        <div style=\"display:flex;align-items:baseline;gap:14px;margin-bottom:8px\"><span style=\"font-size:14px;font-weight:700;color:#DA291C\">10<\u002Fspan><h2 style=\"font-size:30px;font-weight:700;color:#1C1D1B;margin:0;letter-spacing:-.4px\">Accessibility<\u002Fh2><\u002Fdiv>\n        <p style=\"font-size:18px;color:#696B68;margin:0 0 24px;max-width:660px\">Minimum standard: WCAG 2.1 AA. Accessibility is a requirement, not an enhancement.<\u002Fp>\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px\">\n          <sc-for list=\"{{ a11y }}\" as=\"a\" hint-placeholder-count=\"8\">\n            <div style=\"border:1px solid #DFDFDF;border-radius:6px;padding:16px 18px\">\n              <div style=\"font-size:15px;font-weight:600;color:#1C1D1B;margin-bottom:6px\">{{ a.title }}<\u002Fdiv>\n              <div style=\"font-size:14px;color:#373A36;line-height:1.55\">{{ a.body }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <!-- 11 RESPONSIVE -->\n      <section id=\"responsive\">\n        <div style=\"display:flex;align-items:baseline;gap:14px;margin-bottom:8px\"><span style=\"font-size:14px;font-weight:700;color:#DA291C\">11<\u002Fspan><h2 style=\"font-size:30px;font-weight:700;color:#1C1D1B;margin:0;letter-spacing:-.4px\">Responsive Behavior<\u002Fh2><\u002Fdiv>\n        <p style=\"font-size:18px;color:#696B68;margin:0 0 24px;max-width:660px\">One system, three canvases. Content and hierarchy stay identical; density and navigation adapt. <span style=\"color:#B27C12;font-weight:600\">⚠ Extends the guide's mobile + web scope.<\u002Fspan><\u002Fp>\n        <div style=\"border:1px solid #DFDFDF;border-radius:8px;overflow:hidden\">\n          <div style=\"display:grid;grid-template-columns:.8fr 1fr 1fr 1fr;background:#F5F5F4;font-size:12px;font-weight:700;color:#696B68;text-transform:uppercase;letter-spacing:.5px\">\n            <div style=\"padding:11px 16px\">Aspect<\u002Fdiv><div style=\"padding:11px 16px\">Mobile ‹640<\u002Fdiv><div style=\"padding:11px 16px\">Tablet 640–1024<\u002Fdiv><div style=\"padding:11px 16px\">Desktop ›1024<\u002Fdiv>\n          <\u002Fdiv>\n          <sc-for list=\"{{ responsive }}\" as=\"r\" hint-placeholder-count=\"6\">\n            <div style=\"display:grid;grid-template-columns:.8fr 1fr 1fr 1fr;border-top:1px solid #EDEDED;font-size:14px\">\n              <div style=\"padding:13px 16px;font-weight:600;color:#1C1D1B\">{{ r.aspect }}<\u002Fdiv>\n              <div style=\"padding:13px 16px;color:#373A36\">{{ r.mobile }}<\u002Fdiv>\n              <div style=\"padding:13px 16px;color:#373A36\">{{ r.tablet }}<\u002Fdiv>\n              <div style=\"padding:13px 16px;color:#373A36\">{{ r.desktop }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <!-- 12 GOVERNANCE -->\n      <section id=\"governance\">\n        <div style=\"display:flex;align-items:baseline;gap:14px;margin-bottom:8px\"><span style=\"font-size:14px;font-weight:700;color:#DA291C\">12<\u002Fspan><h2 style=\"font-size:30px;font-weight:700;color:#1C1D1B;margin:0;letter-spacing:-.4px\">Governance<\u002Fh2><\u002Fdiv>\n        <p style=\"font-size:18px;color:#696B68;margin:0 0 24px;max-width:680px\">How the system stays coherent as it grows. <span style=\"color:#B27C12;font-weight:600\">⚠ Roles &amp; process extend the guide<\u002Fspan> — assign owners before adopting.<\u002Fp>\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;margin-bottom:20px\">\n          <sc-for list=\"{{ governance }}\" as=\"g\" hint-placeholder-count=\"6\">\n            <div style=\"border:1px solid #DFDFDF;border-radius:6px;padding:16px 18px\">\n              <div style=\"font-size:15px;font-weight:600;color:#1C1D1B;margin-bottom:6px\">{{ g.title }}<\u002Fdiv>\n              <div style=\"font-size:14px;color:#373A36;line-height:1.55\">{{ g.body }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div style=\"border:1px solid #A31F15;background:#F6C9C6;border-radius:8px;padding:16px 20px;font-size:14px;color:#373A36;line-height:1.6\"><strong style=\"color:#A31F15\">Rule.<\u002Fstrong> The Style Guide and Design System must not be applied directly to development without an approved design prototype or demo. Tokens and components ship only after design s
