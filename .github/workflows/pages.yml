name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "onbaording2/**"
      - "design-system/**"
      - "styleguide/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: onbaording2/package-lock.json

      - name: Install dependencies
        working-directory: onbaording2
        run: npm ci

      - name: Build onboarding app
        working-directory: onbaording2
        run: npm run build

      - name: Prepare Pages artifact
        run: |
          mkdir -p _site/onbaording2
          cp -R onbaording2/dist/. _site/onbaording2/
          cp -R design-system _site/
          cp -R styleguide _site/
          touch _site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
